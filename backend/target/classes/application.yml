spring:
  application:
    name: renthub-backend

  # File upload configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/renthub
    username: renthub_admin
    password: renthub_secret
    driver-class-name: org.postgresql.Driver

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true

  # JPA / Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 1s
      timeout: 2s

  # Mail configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: trankhacanh79@gmail.com
    password: cald ekec nahc cjhh
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # RabbitMQ configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: renthub_mq
    password: renthub_mq_secret
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "Yn2kjibddFAWcnEpZ1N+M0F8G7h3zUjK/8A2E8s5W4o="
    expirationMs: 86400000

  aws:
    region: ap-southeast-1
    bucket: renthub-dev-assets
    # Set these values for local MinIO. Leave endpoint empty to use AWS S3.
    contract-bucket: renthub-dev-contracts
    endpoint: http://localhost:9000
    access-key: renthub_minio
    secret-key: renthub_minio_secret
    path-style-access: true

renthub:
  payment:
    vnpay:
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
      frontend-result-url: ${FRONTEND_PAYMENT_RESULT_URL:http://localhost:5173/payment}
    momo:
      api-url: ${MOMO_API_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      partner-code: ${MOMO_PARTNER_CODE:}
      access-key: ${MOMO_ACCESS_KEY:}
      secret-key: ${MOMO_SECRET_KEY:}
      redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173/payment}
      ipn-url: ${MOMO_IPN_URL:}
logging:
  level:
    org.springframework.cache.interceptor: TRACE
    org.springframework.data.redis.cache: TRACE
    org.springframework.amqp.rabbit.connection: DEBUG
    org.springframework.amqp.rabbit.core: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN